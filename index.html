/* ================= 计分（移植自 openjung/core，MIT） ================= */
const SCORE_MIN = 8, SCORE_MAX = 40, THRESHOLD = 24;
const POLES = { EI: ['E', 'I'], SN: ['S', 'N'], TF: ['F', 'T'], JP: ['J', 'P'] };

function computeResult(answers) {
  const scores = { EI: 0, SN: 0, TF: 0, JP: 0 };
  QUESTIONS.forEach(q => { scores[q.dim] += (answers[q.id] ?? 3); });
  let type = '';
  for (const dim of Object.keys(POLES)) {
    type += scores[dim] > THRESHOLD ? POLES[dim][1] : POLES[dim][0];
  }
  const percentages = {};
  for (const dim of Object.keys(POLES)) {
    const right = Math.round((scores[dim] - SCORE_MIN) / (SCORE_MAX - SCORE_MIN) * 100);
    percentages[dim] = { left: 100 - right, right };
  }
  return { type, scores, percentages };
}

/* ================= 状态与视图 ================= */
let current = 0;
let answers = {};
const screens = { home: 'screen-home', quiz: 'screen-quiz', result: 'screen-result' };

function show(name) {
  Object.values(screens).forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(screens[name]).classList.add('active');
  window.scrollTo(0, 0);
}

function startTest() {
  current = 0; answers = {};
  show('quiz'); renderQuestion();
}

function restartTest() {
  document.getElementById('canvasWrap').style.display = 'none';
  startTest();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('qNum').textContent = current + 1;
  document.getElementById('qFill').style.width = ((current) / QUESTIONS.length * 100) + '%';
  document.getElementById('qDim').textContent = '第 ' + (Math.floor(current / 8) + 1) + ' 组 · ' + DIM_INFO[q.dim].name;
  document.getElementById('qTitle').textContent = q.title;
  document.getElementById('qLeft').textContent = '← ' + q.left;
  document.getElementById('qRight').textContent = q.right + ' →';
  const box = document.getElementById('qOptions');
  box.innerHTML = '';
  for (let v = 1; v <= 5; v++) {
    const b = document.createElement('button');
    b.className = 'q-opt' + (answers[q.id] === v ? ' picked' : '');
    b.textContent = v;
    b.onclick = () => pickAnswer(q.id, v);
    box.appendChild(b);
  }
}

function pickAnswer(id, val) {
  answers[id] = val;
  try { localStorage.setItem('quiz_progress', JSON.stringify({ current, answers })); } catch (e) {}
  if (current < QUESTIONS.length - 1) {
    current++; renderQuestion();
  } else {
    document.getElementById('qFill').style.width = '100%';
    finishTest();
  }
}

function prevQuestion() {
  if (current > 0) { current--; renderQuestion(); }
  else { show('home'); }
}

/* ================= 结果渲染 ================= */
let lastResult = null;

function answersCode() {
  return QUESTIONS.map(q => (answers[q.id] ?? 3)).join('');
}

function finishTest() {
  const result = computeResult(answers);
  lastResult = result;
  try {
    localStorage.removeItem('quiz_progress');
    history.replaceState(null, '', '#r=' + answersCode());
  } catch (e) {}
  const info = TYPES[result.type];

  document.getElementById('rType').textContent = result.type;
  document.getElementById('rName').textContent = '「' + info.name + '」';
  document.getElementById('rSlogan').textContent = info.slogan;
  document.getElementById('rDesc').textContent = info.desc;
  document.getElementById('rTags').innerHTML =
    info.tags.map(t => '<span class="result-tag">' + t + '</span>').join('');

  const dimBox = document.getElementById('rDims');
  dimBox.innerHTML = '';
  for (const dim of Object.keys(DIM_INFO)) {
    const p = result.percentages[dim];
    const row = document.createElement('div');
    row.className = 'dim-row';
    row.innerHTML =
      '<div class="dim-labels"><span><b>' + DIM_INFO[dim].left.replace(' ', '') + '</b> <span class="pct">' + p.left + '%</span></span>' +
      '<span class="pct">' + p.right + '%</span> <span><b>' + DIM_INFO[dim].right.replace(' ', '') + '</b></span></div>' +
      '<div class="dim-bar"><div class="l" style="width:' + p.left + '%"></div><div class="r"></div></div>';
    dimBox.appendChild(row);
  }
  show('result');
  setTimeout(drawShareCard, 100);
}

/* ================= 分享卡（Canvas 生成） ================= */
function drawShareCard() {
  if (!lastResult) return;
  const c = document.getElementById('shareCanvas');
  const ctx = c.getContext('2d');
  const info = TYPES[lastResult.type];
  const grad = ctx.createLinearGradient(0, 0, 600, 800);
  grad.addColorStop(0, '#151329'); grad.addColorStop(1, '#241a3f');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 600, 800);

  ctx.strokeStyle = 'rgba(139,92,246,.4)'; ctx.lineWidth = 2;
  ctx.strokeRect(18, 18, 564, 764);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#a78bfa'; ctx.font = '600 20px sans-serif';
  ctx.fillText('人 格 研 究 所', 300, 90);
  ctx.fillStyle = '#94a3b8'; ctx.font = '16px sans-serif';
  ctx.fillText('· 我 的 人 格 类 型 ·', 300, 125);

  ctx.fillStyle = '#f1f5f9'; ctx.font = '900 92px sans-serif';
  ctx.fillText(lastResult.type, 300, 250);
  ctx.fillStyle = '#f472b6'; ctx.font = '800 40px sans-serif';
  ctx.fillText('「' + info.name + '」', 300, 315);
  ctx.fillStyle = '#c4b5fd'; ctx.font = '22px sans-serif';
  ctx.fillText(info.slogan, 300, 360);

  const dims = Object.keys(DIM_INFO);
  dims.forEach((dim, i) => {
    const y = 430 + i * 62;
    const p = lastResult.percentages[dim];
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e2e8f0'; ctx.font = '600 18px sans-serif';
    ctx.fillText(DIM_INFO[dim].left.replace(' ', ''), 80, y);
    ctx.textAlign = 'right';
    ctx.fillText(DIM_INFO[dim].right.replace(' ', ''), 520, y);
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    roundRect(ctx, 80, y + 12, 440, 10, 5); ctx.fill();
    ctx.fillStyle = '#8b5cf6';
    roundRect(ctx, 80, y + 12, 440 * p.left / 100, 10, 5); ctx.fill();
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#94a3b8'; ctx.font = '16px sans-serif';
  const d = new Date();
  const ds = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  ctx.fillText(ds + ' · ' + BRAND.domain, 300, 745);
  document.getElementById('canvasWrap').style.display = 'block';
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function downloadCard() {
  const c = document.getElementById('shareCanvas');
  const a = document.createElement('a');
  a.download = '人格测试-' + lastResult.type + '.png';
  a.href = c.toDataURL('image/png');
  a.click();
}

function copyResultLink() {
  copyText(location.origin + location.pathname + location.hash, '结果链接已复制，发给朋友直接看你的类型');
}

function shareToFriend() {
  const url = location.origin + location.pathname;
  copyText(url + '  32道题测出你的隐藏人格，快来测测你是哪种！', '邀请文案已复制，去粘贴给朋友吧');
}

function copyText(text, okMsg) {
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      alert(okMsg);
    } catch (e) { alert('复制失败，请手动复制地址栏链接'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert(okMsg), fallback);
  } else {
    fallback();
  }
}

/* ================= 分享链接还原（#r=答案串） ================= */
function loadFromHash() {
  const m = location.hash.match(/^#r=([1-5]{32})$/);
  if (!m) return false;
  const restored = {};
  QUESTIONS.forEach((q, i) => { restored[q.id] = parseInt(m[1][i], 10); });
  answers = restored;
  finishTest();
  return true;
}

/* ================= 初始化 ================= */
(function init() {
  const cloud = document.getElementById('typeCloud');
  cloud.innerHTML = Object.entries(TYPES)
    .map(([code, t]) => '<span class="type-chip">' + t.name + '</span>').join('');

  if (!loadFromHash()) {
    try {
      const saved = JSON.parse(localStorage.getItem('quiz_progress') || 'null');
      if (saved && saved.answers && Object.keys(saved.answers).length > 0) {
        answers = saved.answers; current = Math.min(saved.current, QUESTIONS.length - 1);
        show('quiz'); renderQuestion();
      }
    } catch (e) {}
  }
})();
